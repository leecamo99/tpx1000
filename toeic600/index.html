<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10263f">
<title>TOEIC 至高 600 問｜離線題庫</title>
<style>
:root{--ink:#10263f;--paper:#f4f1ea;--card:#fff;--line:#d7d1c5;--accent:#ef9f2f;--accent2:#176c73;--muted:#65727d;--good:#16794f;--bad:#b43b3b;--shadow:0 18px 44px rgba(16,38,63,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Aptos","Segoe UI","Noto Sans TC",system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(16,38,63,.97);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.22)}.brand{font-weight:900;letter-spacing:.04em;white-space:nowrap}.brand i{font-style:normal;color:var(--accent)}.top .meta{font-size:12px;color:#c8d3dd;flex:1}.timer{font-variant-numeric:tabular-nums;font-weight:800}.shell{max-width:1280px;margin:auto;padding:20px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}.side,.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.side{padding:16px;align-self:start;position:sticky;top:72px}.side h2{font-size:14px;margin:0 0 10px}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tests button,.parts button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 6px;font-weight:800}.tests button.on,.parts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.parts button{font-size:12px}.progress{height:8px;background:#e6e1d8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0}.stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:8px 0 14px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:48vh;overflow:auto;padding-right:4px}.palette button{height:34px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:11px;font-weight:750}.palette button.done{background:#e4f3ec;border-color:#a5d1bd;color:#0b6742}.palette button.cur{outline:3px solid var(--accent);outline-offset:1px}.paper{overflow:hidden;min-height:740px}.qhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff}.qnum{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.qtitle{flex:1}.qtitle b{display:block;font-size:18px}.qtitle small{color:var(--muted)}.flag{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;color:var(--muted)}.flag.on{background:#fff1d8;border-color:var(--accent);color:#8a5200}.content{padding:18px 20px 110px}.audioBox{border:1px solid #b9ccd0;background:#eef7f7;border-radius:14px;padding:12px;margin-bottom:14px}.audioBox .row{display:flex;align-items:center;gap:10px}.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent2);color:#fff;font-size:18px}.audioBox audio{width:100%;height:38px}.speed{border:1px solid #a9c0c4;background:#fff;border-radius:8px;padding:7px 9px;color:var(--ink)}.silent{border:1px dashed var(--line);background:#faf8f3;color:var(--muted);border-radius:12px;padding:15px;text-align:center;margin-bottom:14px}.source{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:12px;color:var(--muted)}.source button{border:0;background:transparent;color:var(--accent2);font-weight:800}.scanStack{display:grid;gap:12px}.scan{width:100%;display:block;border:1px solid #c8c1b5;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(16,38,63,.09);cursor:zoom-in}.prompt{border-left:4px solid var(--accent);padding:11px 13px;background:#fff8e8;border-radius:0 10px 10px 0;font-size:14px;line-height:1.6;margin-bottom:14px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.choices button{min-height:58px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;font-size:18px;font-weight:900}.choices button.sel{border-color:var(--accent2);background:#e9f5f5}.choices.revealed button.correct{border-color:var(--good);background:#e8f6ef;color:var(--good)}.choices.revealed button.wrong{border-color:var(--bad);background:#fbecec;color:var(--bad)}.answerNote{display:none;margin-top:12px;border-radius:10px;padding:11px 13px;font-weight:750}.answerNote.show{display:block}.answerNote.good{background:#e8f6ef;color:var(--good)}.answerNote.bad{background:#fbecec;color:var(--bad)}.dock{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:9px;padding:12px 20px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}.dock button{border-radius:11px;padding:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850}.dock .check{background:var(--ink);color:#fff;border-color:var(--ink)}.zoom{position:fixed;inset:0;z-index:50;background:rgba(7,17,29,.94);display:none;padding:24px;overflow:auto}.zoom.open{display:block}.zoom img{display:block;max-width:none;width:min(1200px,180vw);margin:auto;background:#fff}.zoom button{position:fixed;right:18px;top:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--ink);font-size:24px;font-weight:900}.home{max-width:980px;margin:0 auto;padding:42px 20px}.hero{background:var(--ink);color:#fff;border-radius:24px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"600";position:absolute;right:-12px;bottom:-50px;font-size:170px;font-weight:1000;color:rgba(255,255,255,.06)}.hero h1{margin:0;font-size:clamp(30px,7vw,58px);line-height:1}.hero h1 span{color:var(--accent)}.hero p{max-width:620px;color:#c9d5df;line-height:1.7}.testCards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.testCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;box-shadow:0 8px 24px rgba(16,38,63,.08)}.testCard b{font-size:22px}.testCard span{display:block;color:var(--muted);margin:7px 0 13px}.testCard .go{display:inline-block;background:var(--accent);color:var(--ink);font-weight:900;padding:9px 13px;border-radius:9px}.note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.6}.hide{display:none!important}@media(max-width:820px){.shell{display:block;padding:10px}.side{position:static;margin-bottom:10px}.palette{max-height:160px}.paper{min-height:0}.qhead{padding:14px}.content{padding:14px 14px 100px}.choices{grid-template-columns:repeat(2,1fr)}.testCards{grid-template-columns:1fr}.top .meta{display:none}.dock{padding:10px 14px}.source{align-items:flex-start}.source span{max-width:75%}}
</style>
<script src="./bank-data.js"></script>
</head>
<body>
<div id="home" class="home"><section class="hero"><h1>至高 <span>600</span> 問</h1><p>三回 TOEIC L&amp;R 模擬試驗。聽力音檔已依題號接入；Part 1 照片、Part 3／4 圖表及閱讀文件均由原 PDF 定位後截取。</p></section><div id="testCards" class="testCards"><button class="testCard" data-test="1"><b>模擬試驗 1</b><span>0 / 200 題已作答</span><span class="go">開始測驗 →</span></button><button class="testCard" data-test="2"><b>模擬試驗 2</b><span>0 / 200 題已作答</span><span class="go">開始測驗 →</span></button><button class="testCard" data-test="3"><b>模擬試驗 3</b><span>0 / 200 題已作答</span><span class="go">開始測驗 →</span></button></div><p class="note">離線可用。作答紀錄只保存在目前瀏覽器。題面與音檔均來自你提供的來源檔。</p></div>
<div id="exam" class="app hide"><header class="top"><button id="homeBtn" class="speed">首頁</button><div class="brand">至高 <i>600</i> 問</div><div class="meta" id="topMeta"></div><div class="timer" id="timer">00:00</div></header><main class="shell"><aside class="side"><h2>模擬試驗</h2><div class="tests" id="tests"></div><div class="parts" id="parts"></div><div class="progress"><i id="bar"></i></div><div class="stats"><span id="doneStat">0 / 200</span><span id="scoreStat">未檢查</span></div><div class="palette" id="palette"></div></aside><section class="paper"><div class="qhead"><div class="qnum" id="qnum">1</div><div class="qtitle"><b id="qtitle">Part 1</b><small id="qsub"></small></div><button class="flag" id="flagBtn">標記</button></div><div class="content"><div id="audioWrap"></div><div class="source"><span id="sourceInfo"></span><button id="zoomBtn" class="hide">放大題面</button></div><div id="visualWrap"></div><div id="prompt" class="prompt hide"></div><div class="choices" id="choices"></div><div id="answerNote" class="answerNote"></div></div><div class="dock"><button id="prevBtn">上一題</button><button class="check" id="checkBtn">檢查答案</button><button id="nextBtn">下一題</button></div></section></main></div><div class="zoom" id="zoom"><button id="zoomClose">×</button><div id="zoomBody"></div></div>
<script>
(function(){'use strict';
const BANK=window.TOEIC600_BANK,KEY='toeic600-progress-v1';let test=1,q=1,started=0,tick=0;const $=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
function bucket(t){return state[t]||(state[t]={answers:{},flags:{},revealed:{},elapsed:0,last:1})}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function partOf(n){return n<=6?1:n<=31?2:n<=70?3:n<=100?4:n<=130?5:n<=146?6:7}function partRange(p){return [[1,6],[7,31],[32,70],[71,100],[101,130],[131,146],[147,200]][p-1]}
function home(){clearInterval(tick);$('exam').classList.add('hide');$('home').classList.remove('hide');renderCards()}function start(t,n){test=t;q=n||bucket(t).last||1;started=Date.now();$('home').classList.add('hide');$('exam').classList.remove('hide');renderAll();clearInterval(tick);tick=setInterval(timer,1000);timer()}
function renderCards(){let h='';for(let t=1;t<=3;t++){let b=bucket(t),done=Object.keys(b.answers).length;h+=`<button class="testCard" data-test="${t}"><b>模擬試驗 ${t}</b><span>${done} / 200 題已作答</span><i class="progress"><i style="width:${done/2}%"></i></i><span class="go">${done?'繼續作答':'開始測驗'} →</span></button>`}$('testCards').innerHTML=h;document.querySelectorAll('.testCard').forEach(x=>x.onclick=()=>start(+x.dataset.test))}
function timer(){let b=bucket(test),s=b.elapsed+Math.floor((Date.now()-started)/1000),m=Math.floor(s/60),x=s%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function commitTime(){if(!started)return;bucket(test).elapsed+=Math.floor((Date.now()-started)/1000);started=Date.now();save()}
function renderAll(){renderSide();renderQuestion()}function renderSide(){let b=bucket(test),done=Object.keys(b.answers).length;$('tests').innerHTML=[1,2,3].map(t=>`<button class="${t===test?'on':''}" data-t="${t}">TEST ${t}</button>`).join('');document.querySelectorAll('#tests button').forEach(x=>x.onclick=()=>{commitTime();test=+x.dataset.t;q=bucket(test).last||1;renderAll()});$('parts').innerHTML=[1,2,3,4,5,6,7].map(p=>`<button class="${p===partOf(q)?'on':''}" data-p="${p}">P${p}</button>`).join('');document.querySelectorAll('#parts button').forEach(x=>x.onclick=()=>go(partRange(+x.dataset.p)[0]));$('palette').innerHTML=Array.from({length:200},(_,i)=>{let n=i+1;return `<button data-q="${n}" class="${b.answers[n]?'done ':''}${n===q?'cur':''}">${n}${b.flags[n]?' •':''}</button>`}).join('');document.querySelectorAll('#palette button').forEach(x=>x.onclick=()=>go(+x.dataset.q));$('doneStat').textContent=done+' / 200';$('bar').style.width=(done/2)+'%';let scored=Object.keys(b.revealed).length,ok=0;Object.keys(b.revealed).forEach(n=>{if(b.answers[n]===BANK.tests[test].questions[n-1].answer)ok++});$('scoreStat').textContent=scored?`${ok} / ${scored} 正確`:'未檢查'}
function renderQuestion(){let item=BANK.tests[test].questions[q-1],b=bucket(test),part=item.part;$('qnum').textContent=q;$('qtitle').textContent='Part '+part;$('qsub').textContent=`TEST ${test} · Question ${q}`;$('topMeta').textContent=`TEST ${test} · Part ${part} · ${q}/200`;b.last=q;save();$('flagBtn').classList.toggle('on',!!b.flags[q]);$('flagBtn').textContent=b.flags[q]?'已標記':'標記';renderAudio(item);renderVisual(item);renderChoices(item);renderSide();window.scrollTo({top:0,behavior:'smooth'})}
function renderAudio(item){let w=$('audioWrap');if(!item.audio){w.innerHTML=item.n<=100?'<div class="silent">來源音檔包未包含此題音檔（TEST 3 第 2 題）。題面照片仍可使用。</div>':'<div class="silent">閱讀題沒有音檔，請閱讀 PDF 題面後作答。</div>';return}w.innerHTML=`<div class="audioBox"><div class="row"><button class="play" id="playBtn" aria-label="播放">▶</button><audio id="audio" preload="metadata" src="${item.audio}"></audio><button class="speed" id="speedBtn">1×</button></div></div>`;let a=$('audio'),pb=$('playBtn'),rates=[1,1.25,1.5,.75],ri=0;pb.onclick=()=>{if(a.paused)a.play();else a.pause()};a.onplay=()=>pb.textContent='Ⅱ';a.onpause=()=>pb.textContent='▶';a.onended=()=>pb.textContent='▶';$('speedBtn').onclick=()=>{ri=(ri+1)%rates.length;a.playbackRate=rates[ri];$('speedBtn').textContent=rates[ri]+'×'}}
function renderVisual(item){let wrap=$('visualWrap'),prompt=$('prompt'),src=item.sourcePages.length?'PDF 第 '+item.sourcePages.join('、')+' 頁':'聽力作答';$('sourceInfo').textContent=src;$('zoomBtn').classList.toggle('hide',!item.images.length);if(!item.images.length){wrap.innerHTML='';prompt.textContent='播放音檔，從 A、B、C 中選出最適合的回應。';prompt.classList.remove('hide');return}prompt.classList.add('hide');wrap.innerHTML='<div class="scanStack">'+item.images.map((u,i)=>`<img class="scan" src="${u}" alt="TEST ${test} 第 ${q} 題 PDF 題面${item.images.length>1?'（'+(i+1)+'/'+item.images.length+'）':''}" loading="eager">`).join('')+'</div>';wrap.querySelectorAll('img').forEach(x=>x.onclick=openZoom)}
function renderChoices(item){let b=bucket(test),sel=b.answers[q],rev=b.revealed[q],box=$('choices');box.classList.toggle('revealed',!!rev);box.innerHTML=item.choices.map(c=>`<button data-c="${c}" class="${sel===c?'sel ':''}${rev&&c===item.answer?'correct ':''}${rev&&sel===c&&c!==item.answer?'wrong':''}">${c}</button>`).join('');box.querySelectorAll('button').forEach(x=>x.onclick=()=>{b.answers[q]=x.dataset.c;delete b.revealed[q];save();renderChoices(item);renderSide();$('answerNote').className='answerNote'});let note=$('answerNote');if(rev){let ok=sel===item.answer;note.className='answerNote show '+(ok?'good':'bad');note.textContent=ok?'答對了：'+item.answer:'正確答案：'+item.answer}else note.className='answerNote'}
function go(n){q=Math.max(1,Math.min(200,n));renderQuestion()}function check(){let item=BANK.tests[test].questions[q-1],b=bucket(test);if(!b.answers[q]){alert('請先選擇答案');return}b.revealed[q]=1;save();renderChoices(item);renderSide()}
function openZoom(){let item=BANK.tests[test].questions[q-1];$('zoomBody').innerHTML=item.images.map(u=>`<img src="${u}" alt="放大題面">`).join('');$('zoom').classList.add('open')}
$('homeBtn').onclick=()=>{commitTime();home()};$('prevBtn').onclick=()=>go(q-1);$('nextBtn').onclick=()=>go(q+1);$('checkBtn').onclick=check;$('flagBtn').onclick=()=>{let b=bucket(test);b.flags[q]=!b.flags[q];save();renderQuestion()};$('zoomBtn').onclick=openZoom;$('zoomClose').onclick=()=>$('zoom').classList.remove('open');$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').classList.remove('open')};document.addEventListener('keydown',e=>{if(!$('exam').classList.contains('hide')){if(['a','b','c','d'].includes(e.key.toLowerCase())){let x=document.querySelector(`#choices button[data-c="${e.key.toUpperCase()}"]`);if(x)x.click()}else if(e.key==='ArrowRight')go(q+1);else if(e.key==='ArrowLeft')go(q-1);else if(e.key===' '){e.preventDefault();let a=$('audio');if(a)a.paused?a.play():a.pause()}}});window.addEventListener('beforeunload',commitTime);renderCards();
})();
</script></body></html>
