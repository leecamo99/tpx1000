<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/json,{"name":"金のフレーズ","short_name":"金フレ","display":"standalone","start_url":"./kin-app.html","background_color":"#ffffff","theme_color":"#c45c1a"}">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>金のフレーズ 繁中版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC",-apple-system,sans-serif;background:#f5f5f5;color:#222;max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer}

/* screens */



/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #eee}
.topbar .back{width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar h1{font-size:16px;font-weight:600;flex:1}
.topbar .icon-btn{width:36px;height:36px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:16px;color:#666}

/* LIST screen */
.list-stats{background:#fff;padding:16px 16px 8px;display:flex;justify-content:space-around;text-align:center}
.list-stats .n{font-size:22px;font-weight:700}
.list-stats .l{font-size:11px;color:#888;margin-top:2px}
.list-stats .ok{color:#2a9d4a}
.list-stats .rev{color:#e05050}
.list-stats .new{color:#999}
.progress-bar{height:6px;background:#e8e8e8;border-radius:3px;margin:8px 16px 12px;overflow:hidden}
.progress-bar i{display:block;height:100%;background:#c45c1a;border-radius:3px;width:0%;transition:width .3s}
.list-actions{display:flex;gap:10px;padding:0 16px 12px}
.list-actions button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:1.5px solid #222}
.list-actions .primary{background:#222;color:#fff}
.list-actions .ghost{background:#fff;color:#222}
.section-pick{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#666}
.section-pick select{border:1px solid #ddd;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
.item{background:#fff;padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px}
.item:active{background:#fafafa}
.item .meta{flex:1;min-width:0}
.item .en{font-size:15px;font-weight:500;color:#222}
.item .sub{font-size:12px;color:#999;margin-top:2px}
.item .mark{width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ccc;flex-shrink:0}
.item.done .mark{border-color:#2a9d4a;color:#2a9d4a;background:#eef8f0}
.item.review .mark{border-color:#e05050;color:#e05050;background:#fdf0f0}
.item .word-id{font-size:12px;color:#c45c1a;font-weight:600}

/* DETAIL screen */
.detail-top{background:#fff;padding:12px 16px 8px}
.detail-word-small{font-size:13px;color:#888}
.detail-score{font-size:12px;margin:4px 0 10px;color:#888}
.detail-score span{margin-right:8px}
.detail-en{font-size:22px;font-weight:600;line-height:1.4;margin-bottom:6px}
.detail-en .hl{color:#c45c1a}
.detail-ja{font-size:16px;color:#333;margin-bottom:12px}
.card{margin:0 12px 12px;border-radius:12px;overflow:hidden;border:1px solid #eee;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-head{background:#fdf3e6;padding:12px 14px;display:flex;align-items:baseline;justify-content:space-between}
.card-head .num{font-size:12px;color:#999;margin-right:6px}
.card-head .hw{font-size:22px;font-weight:700;color:#c45c1a}
.card-head .phon{font-size:13px;color:#999}
.card-body{padding:12px 14px}
.card-pos{font-size:14px;margin-bottom:8px}
.card-pos .tag{display:inline-block;background:#eee;color:#555;font-size:11px;padding:2px 6px;border-radius:3px;margin-right:6px}
.card-note{background:#fdf8f0;padding:10px 12px;border-radius:8px;font-size:13px;color:#555;margin-bottom:10px}
.card-ex{background:#f5f5f5;padding:10px 12px;border-radius:8px}
.card-ex .ja{color:#c45c1a;font-size:14px;margin-bottom:4px}
.card-ex .en{font-size:15px;font-weight:500}
.card-ex .en .hl{color:#c45c1a}
.detail-actions{display:flex;gap:10px;padding:8px 16px 16px}
.detail-actions button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600}
.btn-ok{background:#eef8f0;color:#2a9d4a;border:1.5px solid #2a9d4a}
.btn-rev{background:#fdf0f0;color:#e05050;border:1.5px solid #e05050}
.btn-skip{background:#f5f5f5;color:#888;border:1.5px solid #ddd}

/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:60}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#999;padding:4px}
.bottom-nav button.active{color:#c45c1a}
.bottom-nav .ico{font-size:20px}

/* filter modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:75vh;overflow-y:auto;padding:16px 16px 32px}
.modal h2{font-size:16px;text-align:center;margin-bottom:16px}
.modal .opt{display:flex;align-items:center;padding:12px 4px;border-bottom:1px solid #f0f0f0;font-size:14px}
.modal .opt input{width:20px;height:20px;margin-left:auto;accent-color:#c45c1a}
.modal .opt .sub{font-size:12px;color:#999;margin-top:2px}
.modal .done-btn{display:block;width:100%;padding:14px;background:#222;color:#fff;border-radius:12px;font-size:15px;font-weight:600;text-align:center;margin-top:16px}

/* empty */
.empty{text-align:center;padding:60px 20px;color:#999;font-size:14px}

/* circular progress */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 16px 8px;background:#fff}
.ring{position:relative;width:140px;height:140px}
.ring svg{transform:rotate(-90deg);width:140px;height:140px}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:#e8e8e8}
.ring .fg{stroke:#c45c1a;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring .pct .num{font-size:32px;font-weight:700;color:#222;line-height:1}
.ring .pct .unit{font-size:13px;color:#999;margin-top:2px}
.ring-title{font-size:13px;color:#666;margin-top:10px;text-align:center}


/* audio player */
.player-bar{
  position:fixed;bottom:56px;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:9999;
  background:#fff;border-top:1px solid #eee;padding:10px 14px;
  display:none;align-items:center;gap:10px;
  box-shadow:0 -2px 16px rgba(0,0,0,.12);
}
.player-bar.show{display:flex}
.player-bar .play-btn{
  width:42px;height:42px;border-radius:50%;background:#c45c1a;color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.player-bar .play-btn:active{transform:scale(.94)}
.player-bar .info{flex:1;min-width:0;font-size:12px;color:#666}
.player-bar .info .t{font-size:13px;color:#222;font-weight:600}
.player-bar .speed{
  font-size:12px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fafafa;
}


.detail-play{
  display:inline-flex;align-items:center;gap:6px;margin:8px 16px;
  padding:8px 14px;border-radius:20px;background:#c45c1a;color:#fff;
  font-size:13px;font-weight:600;
}
.detail-play:active{opacity:.85}


.tap-play{cursor:pointer;user-select:none;-webkit-user-select:none}
.tap-play:active{opacity:.7}
.card-head .hw.tap-play{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.detail-en.tap-play .hl{border-bottom:2px solid #c45c1a}
.card-ex .en.tap-play{border-left:3px solid #c45c1a;padding-left:8px}


.player-bar .times{
  font-size:12px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;background:#fafafa;
  max-width:72px;
}


.senses-block{margin:12px 16px;display:none}
.senses-block.show{display:block}
.sense-card{
  background:#fff;border:1px solid #eee;border-radius:10px;
  padding:10px 12px;margin-bottom:8px;
}
.sense-card .s-en{font-size:14px;color:#222;font-weight:500}
.sense-card .s-en .hl{background:#ffe0b2;color:#c45c1a;padding:0 2px;border-radius:2px}
.sense-card .s-zh{font-size:13px;color:#555;margin-top:4px}
.sense-card .s-mean{
  display:inline-block;font-size:11px;background:#f5e6d3;color:#8b4513;
  padding:1px 6px;border-radius:4px;margin-right:4px;font-weight:600
}
.sense-card .s-pos{
  display:inline-block;font-size:11px;background:#eee;color:#666;
  padding:1px 6px;border-radius:4px;margin-right:4px
}


.item .hw{color:#c45c1a;font-weight:700;font-size:15px}
.item .word-id{color:#c45c1a;font-weight:600;font-size:12px}
.item .sub{font-size:12px;color:#666;margin-top:2px;line-height:1.35}


/* ===== book-style detail ===== */
.screen-detail .card{
  margin:0;border-radius:0;box-shadow:none;background:#fff;
  border:none;padding:0;
}
.detail-book{
  max-width:640px;margin:0 auto;background:#fff;
  border:1px solid #ddd;border-radius:6px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
.db-head{
  display:grid;grid-template-columns:minmax(120px,auto) 1fr;
  background:#fdf8f0;border-bottom:1px solid #e8e0d0;
  align-items:stretch;
}
.db-word{
  background:#f0d4a8;padding:12px 14px;
  font-size:20px;font-weight:700;color:#222;
  display:flex;align-items:center;
}
.db-meta{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.db-phon{font-size:12px;color:#999;font-family:Consolas,monospace;text-align:right}
.db-posline{font-size:13px;color:#333}
.db-pos{
  display:inline-block;background:#e8e8e8;color:#333;
  font-size:11px;padding:1px 6px;border-radius:2px;margin-right:4px
}
.db-mean{color:#333}
.db-note{
  background:#faf7f2;padding:10px 14px;font-size:13px;color:#333;
  line-height:1.55;border-bottom:1px solid #eee
}
.db-note .ico{
  display:inline-block;width:14px;height:14px;background:#f0dcc4;
  border:1px solid #c9a87a;border-radius:50%;text-align:center;
  line-height:12px;font-size:9px;color:#7a5a30;margin-right:4px;vertical-align:-1px
}
.db-ex{
  border-top:1px solid #eee
}
.db-ex-en{
  background:#fff;padding:10px 14px 4px;
  font-size:15px;font-weight:600;color:#222
}
.db-ex-en .hl{color:#c45c1a}
.db-ex-zh{
  background:#f0eeea;padding:4px 14px 10px;
  font-size:13px;color:#555
}
.db-ex-zh .hl{color:#c45c1a;font-weight:500}
.db-sense{
  border-top:1px solid #e8e0d0
}
.db-sense .db-ex-en{border-top:none}
.db-idbar{
  background:#4a4a4a;color:#fff;font-size:11px;padding:6px 12px;
  display:flex;justify-content:space-between
}
.senses-block{margin:0!important;padding:0!important}
.senses-block.show{display:block}
.sense-card{
  background:transparent!important;border:none!important;
  border-radius:0!important;padding:0!important;margin:0!important
}


/* minimal play */
.detail-play{
  display:inline-flex!important;align-items:center;justify-content:center;
  width:44px;height:44px;margin:12px auto!important;
  padding:0!important;border-radius:50%!important;
  background:#fff!important;color:#c45c1a!important;
  border:1.5px solid #e0c8a8!important;
  font-size:16px!important;font-weight:600!important;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.detail-play:active{background:#fdf8f0!important;transform:scale(.96)}
/* hide legacy empty beige header blocks in detail */
.screen-detail .card-head,
.screen-detail .legacy-num,
.screen-detail #dNum:not(.keep),
.screen-detail .detail-num-bar{
  display:none!important;
}
/* center play under book card */
#detailBook + .detail-play,
.detail-book + .detail-play{
  display:flex!important;margin-left:auto!important;margin-right:auto!important;
}
.detail-actions{display:flex;gap:8px;justify-content:center;padding:8px 16px 16px;flex-wrap:wrap}




.screen-detail .detail-play{
  display:flex!important;margin:14px auto 4px!important;
}


.item .mark{
  width:32px;height:32px;min-width:32px;border-radius:50%;
  border:1.5px solid #ddd;background:#fff;color:#999;
  font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;flex-shrink:0;
}
.item .mark.mark-ok{
  border-color:#2a9d4a;color:#2a9d4a;background:#f0faf2;
}
.item .mark.mark-rev{
  border-color:#e05050;color:#e05050;background:#fff5f5;
}
.item .mark.mark-none{color:transparent}
.item .mark:active{transform:scale(.92)}
.item .meta{flex:1;min-width:0;cursor:pointer;padding:4px 0}
.item{cursor:default}


/* force hide legacy detail chrome */
#screen-detail .detail-top,
#screen-detail > .card,
#screen-detail .detail-word-small,
#screen-detail #dWordSmall,
#screen-detail #dOk,
#screen-detail #dNg,
#screen-detail #dQ,
#screen-detail .detail-score,
#screen-detail #dEn,
#screen-detail #dJa,
#screen-detail #dNum,
#screen-detail #dHw,
#screen-detail #dPhon,
#screen-detail #dPos,
#screen-detail #dMean,
#screen-detail #dNote,
#screen-detail #dExEn,
#screen-detail #dExJa,
#screen-detail .card-head,
#screen-detail .card-body,
#screen-detail .card-ex,
#screen-detail .senses-block{
  display:none !important;
  height:0 !important;
  overflow:hidden !important;
  margin:0 !important;
  padding:0 !important;
  border:none !important;
  visibility:hidden !important;
}
#screen-detail #detailBook{
  display:block !important;
  visibility:visible !important;
  height:auto !important;
  margin:8px 12px 0 !important;
}
#screen-detail .detail-play{
  display:flex !important;
  visibility:visible !important;
}


.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.topbar h1{flex:1;font-size:16px;margin:0;text-align:center}
.topbar-right{display:flex;align-items:center;gap:6px}
.topbar .icon-btn.play-top{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid #e0c8a8;background:#fff;color:#c45c1a;
  font-size:14px;display:flex;align-items:center;justify-content:center;
}
.topbar .icon-btn.play-top:active{background:#fdf8f0}
.topbar .icon-btn#markBtn{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid #ddd;background:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
/* hide old floating play if any */
.detail-play{display:none!important}




.browse-pick{position:sticky;top:0;background:#fff;z-index:5;padding:8px 16px;border-bottom:1px solid #eee}


/* panes: 習得=進度, 一覽=列表 */


/* screens */
.screen{display:none;min-height:100vh;padding-bottom:88px;background:#f7f7f7}
.screen.active{display:block !important}

/* 習得 / 一覽 panes */
#paneStudy{display:block;background:#fff;padding-bottom:24px}
#paneBrowse{display:none;background:#fff;padding-bottom:24px}
body.mode-browse #paneStudy{display:none !important}
body.mode-browse #paneBrowse{display:block !important}
body.mode-study #paneStudy{display:block !important}
body.mode-study #paneBrowse{display:none !important}

.ring-wrap{display:flex !important;flex-direction:column;align-items:center;padding:24px 16px 12px;background:#fff}
.list-stats{display:flex !important;background:#fff;padding:16px;justify-content:space-around;text-align:center}
.list-actions{display:flex !important;gap:10px;padding:12px 16px 8px;background:#fff}
.list-actions .primary{
  flex:1;background:#222;color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer
}
.list-actions .ghost{
  flex:1;background:#fff;color:#222;border:1.5px solid #222;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer
}
.section-pick{display:flex !important;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-top:1px solid #eee}


.level-head{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;border:none;background:#fff;padding:18px 16px 8px;
  font-size:16px;font-weight:600;color:#222;cursor:pointer;
}
.level-head .chev{font-size:20px;color:#bbb;font-weight:400}
.pane-study .ring-wrap{padding:12px 16px 8px}
.pane-study .list-stats{
  display:flex;justify-content:space-around;text-align:center;
  padding:8px 16px 20px;background:#fff;
}
.pane-study .list-stats .n{font-size:22px;font-weight:700;color:#222}
.pane-study .list-stats .n.ok{color:#222}
.pane-study .list-stats .l{font-size:12px;color:#888;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:#3cb371}
.dot.rev{background:#e05555}
.dot.new{background:#c8c8c8}
.pane-study .list-actions{
  display:flex;gap:12px;padding:8px 24px 32px;background:#fff;justify-content:center;
}
.pane-study .list-actions .primary{
  min-width:140px;background:#2a2a2a;color:#fff;border:none;border-radius:10px;
  padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;
}
.pane-study .list-actions .ghost-dark{
  background:#2a2a2a;color:#fff;
}
/* hide old topbar title on study or keep */
#screen-list > .topbar{display:none}
body.mode-browse #screen-list > .topbar{display:flex}


/* CRITICAL pane toggle */
body.mode-study #paneStudy{display:block !important}
body.mode-study #paneBrowse{display:none !important}
body.mode-browse #paneStudy{display:none !important}
body.mode-browse #paneBrowse{display:block !important}


.audio-hint{
  display:none;position:fixed;left:12px;right:12px;bottom:72px;z-index:9999;
  background:#fff5f5;border:2px solid #e05050;color:#8b0000;
  padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;
  box-shadow:0 4px 20px rgba(0,0,0,.15);max-width:480px;margin:0 auto;
}
.audio-hint.show{display:block}
.audio-hint code{background:#ffe8e8;padding:1px 4px;border-radius:3px}

<body class="mode-study">

<!-- LIST -->
<div id="screen-list" class="screen active">
  <div class="topbar">
    <h1>金のフレーズ 全集合</h1>
    <button class="icon-btn" onclick="openFilter()" title="篩選">☰</button>
  </div>
  
  <!-- 習得：進度主頁 -->
  <div id="paneStudy" class="pane-study">
    <button type="button" class="level-head" onclick="openFilter()" id="levelHeadBtn">
      <span id="levelHeadText">全部範圍</span>
      <span class="chev">›</span>
    </button>
    <div class="ring-wrap">
      <div class="ring">
        <svg viewBox="0 0 140 140">
          <circle class="bg" cx="70" cy="70" r="60"></circle>
          <circle class="fg" id="ringFg" cx="70" cy="70" r="60"
            stroke-dasharray="376.99" stroke-dashoffset="376.99"></circle>
        </svg>
        <div class="pct"><div class="num" id="pctNum">0</div><div class="unit">%</div></div>
      </div>
    </div>
    <div class="list-stats">
      <div class="st">
        <div class="n ok" id="statOk">0</div>
        <div class="l"><span class="dot ok"></span>已習得</div>
      </div>
      <div class="st">
        <div class="n rev" id="statRev">0</div>
        <div class="l"><span class="dot rev"></span>要複習</div>
      </div>
      <div class="st">
        <div class="n new" id="statNew">0</div>
        <div class="l"><span class="dot new"></span>未學習</div>
      </div>
    </div>

standing job.", "level": "730", "level_label": "730分級　加速的300語", "section": "730", "section_label": "730分級　加速的300語", "source": "main"}, {"id": "484", "word": "implement", "phon": "動[ímpləmə̀nt]名[ímpləmənt]", "pos": "", "mean": "動 執行、導入　名 工具", "note": "把計畫或方針付諸實行。 名 implementation（導入、執行） 類 execute（執行）、enforce（施行）", "ja": "執行計畫", "en": "implement a plan", "level": "730", "level_label": "730分級　加速的300語", "section": "730", "section_label": "730分級　加速的300語", "source": "main"}, {"id": "485", "word": "publicity", "phon": "[pʌblísəti]", "pos": "名", "mean": "宣傳、曝光、關注", "note": "吸引公眾注意或為此進行的活動。 動 publicize（宣傳） 名 publicist（宣傳人員） 關 public relations（公關）", "ja": "新電影的宣傳", "en": "publicity for a new movie", "level": "730", "level_label": "730分級　加速的300語", "section": "730", "section_label": "730分級　加速的300語", "source": "main"}, {"id": "486", "word": "aisle", "phon": "[áɪl]", "pos": "名", "mean": "走道、通道", "note": "TOEIC 世界沒有香菸，因此不會被問想要吸菸區還是非吸菸區。Listening 也會出現，注意 s 不發音。", "ja": "請給我走道座位。", "en": "I would like an aisle seat, please.", "level": "730", "level_label": "730分級　加速的300語", "section": "730", "section_label": "730分級　加速的300語", "source": "main"}, {"id": "487", "word": "auditorium", "phon": "[ɔ̀ːdətɔ́ːriəm]", "pos": "名", "mean": "禮堂、觀眾席", "note": "Part 1 也有出題例。 例 Some people are gathered in an auditorium.（有人聚集在禮堂） 關 audience（聽眾）、gymnasium（體育館）", "ja": "有 300 個座位的禮堂", "en": "a 300-seat auditorium", "level": "730", "level_label": "730分級　加速的300語", "section": "730", "section_label": "730分級　加速的300語", "source": "main"}, {"id": "488", "word": "capacity", "phon": "[kəpǽsəti]", "pos": "名", "mean": "容量、容納能力、生產能力、身分", "note": "「身分、角色」意思也要記。 例 in my capacity as manager（以經理的身分） 形 capable（有能力的） 關 capability（能力）、output（產出）", "ja": "這台電腦有大容量儲存空間。", "en": "This computer has a large storage capacity.", "level": "730", "level_label": "730分級　加速的300語", "section": "730", "section_label": "730分級　加速的300語", "source": "main"}, {"id": "489", "word": "laundry", "phon": "[lɔ́ːndri]", "pos": "名", "mean": "洗衣（物）", "no const STORE_KEY = 'kin-app-status-v1';
let statusMap = {}; // id -> 'ok' | 'review' | ''
let currentLevel = 'all';
let currentList = [];
let currentIdx = 0;
// 'new' | 'review' | 'all'

function loadStatus(){
  try{ statusMap = JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){ statusMap={}; }
}
function saveStatus(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(statusMap)); }catch(e){}
}


// 'study' | 'browse'






function updateStats(){
  const list = filtered();
  let ok=0,rev=0,neu=0;
  list.forEach(e=>{
    const s=statusMap[e.id]||'';
    if(s==='ok') ok++;
    else if(s==='review') rev++;
    else neu++;
  });
  var _lh=document.getElementById('levelHeadText');
  if(_lh){
    var _lab={all:'全部範圍','600':'600分級　助跑的400語','730':'730分級　加速的300語','860':'860分級　飛躍的200語','990':'990分級　頂點的100語',S1:'Supplement 1',S2:'Supplement 2',S3:'Supplement 3',S4:'Supplement 4',S5:'Supplement 5',S6:'Supplement 6',S7:'Supplement 7',COL:'Column 1–4'};
    _lh.textContent=_lab[currentLevel]||currentLevel||'全部範圍';
  }
  document.getElementById('statOk').textContent=ok;
  document.getElementById('statRev').textContent=rev;
  document.getElementById('statNew').textContent=neu;
  document.getElementById('btnNewN').textContent=neu;
  document.getElementById('btnRevN').textContent=rev;
  const pct = list.length ? Math.round(ok/list.length*100) : 0;
  document.getElementById('progBar').style.width = pct+'%';
  var circ = 2 * Math.PI * 60; // r=60
  var fg = document.getElementById('ringFg');
  if(fg){
    fg.style.strokeDasharray = circ;
    fg.style.strokeDashoffset = circ * (1 - pct/100);
  }
  var pn = document.getElementById('pctNum');
  if(pn) pn.textContent = pct;
  var rt = document.getElementById('ringTitle');
  if(rt){
    var lab = {all:'全部範圍','600':'600分級','730':'730分級','860':'860分級','990':'990分級',
      S1:'Supplement 1',S2:'Supplement 2',S3:'Supplement 3',S4:'Supplement 4',
      S5:'Supplement 5',S6:'Supplement 6',S7:'Supplement 7',COL:'Column 1–4'};
    rt.textContent = (lab[currentLevel]||currentLevel) + '　' + ok + ' / ' + list.length;
  }
  // modal counts
  const count = lv => DATA.filter(e=>lv==='all'||e.level===lv).length;
  ['All','600','730','860','990','S1','S2','S3','S4','S5','S6','S7','COL'].forEach(function(k){
    var el = document.getElementById('f'+k);
    if(el) el.textContent = count(k==='All'?'all':k)+' 語';
  });
}

function renderList(){
  const box = document.getElementById('itemList');
  const list = filtered();
  if(!list.length){ box.innerHTML='<div class="empty">沒有項目</div>'; return; }
  box.innerHTML = list.map(e=>{
    const s=statusMap[e.id]||'';
    const cls = s==='ok'?'done':(s==='review'?'review':'');
    const mark = s==='ok'?'✓':(s==='review'?'!':'');
    // 點單字區→解說；點右側圓圈→循環 空白→！→✓
    const head = e.word || '';
    const mean = e.mean || e.pos || '';
    const sub = mean || (e.level_label||'');
    const markIcon = s==='ok' ? '✓' : (s==='review' ? '!' : '');
    const markCls = s==='ok' ? 'mark-ok' : (s==='review' ? 'mark-rev' : 'mark-none');
    return `<div class="item ${cls}">
      <div class="meta" onclick="openDetail('${e.id}')">
        <div class="en"><span class="word-id">${escapeHtml(e.id)}</span>　<span class="hw">${escapeHtml(head)}</span></div>
        <div class="sub">${escapeHtml(sub)}</div>
      </div>
      <button type="button" class="mark ${markCls}" onclick="event.stopPropagation();cycleStatus('${e.id}')" title="點擊切換狀態">${markIcon}</button>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlightWord(en, word){
  if(!en||!word) return escapeHtml(en);
  const re = new RegExp('('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return escapeHtml(en).replace(re,'<span class="hl">$1</span>');
}

// study=習得主頁, browse=一覽單字
function setListMode(mode){
  listMode = (mode === 'browse') ? 'browse' : 'study';
  document.body.className = document.body.className
    .replace(/\bmode-study\b/g,'').replace(/\bmode-browse\b/g,'').replace(/\s+/g,' ').trim();
  document.body.classList.add(listMode === 'browse' ? 'mode-browse' : 'mode-study');
  var ns = document.getElementById('navStudy');
  var nl = document.getElementById('navList');
  if(ns){ ns.classList.toggle('active', listMode==='study'); }
  if(nl){ nl.classList.toggle('active', listMode==='browse'); }
  var det = document.getElementById('screen-detail');
  var lst = document.getElementById('screen-list');
  if(det) det.classList.remove('active');
  if(lst) lst.classList.add('active');
  try { updateStats(); } catch(err){ console.warn(err); }
  if(listMode==='browse'){
    var s2 = document.getElementById('levelSelect2');
    if(s2) s2.value = currentLevel || 'all';
    currentList = filtered();
    renderList();
    window.scrollTo(0,0);
  } else {
    window.scrollTo(0,0);
  }
}







function studyQueue(){
  // 未學習 or 複習佇列
  var list = filtered();
  if(studyMode === 'new') return list.filter(function(e){ return !statusMap[e.id]; });
  if(studyMode === 'review') return list.filter(function(e){ return statusMap[e.id]==='review'; });
  return list;
}

function startStudy(mode){
  studyMode = mode || 'new';
  listMode = 'study';
  document.body.classList.add('mode-study');
  document.body.classList.remove('mode-browse');
  var ns = document.getElementById('navStudy');
  var nl = document.getElementById('navList');
  if(ns) ns.classList.add('active');
  if(nl) nl.classList.remove('active');
  currentList = studyQueue();
  if(!currentList.length){
    alert(studyMode==='new' ? '沒有未學習項目' : '沒有要複習項目');
    updateStats();
    return;
  }
  currentIdx = 0;
  updateStats();
  showDetail();
}

function showList(){
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
  document.body.classList.toggle('mode-study', listMode==='study');
  document.body.classList.toggle('mode-browse', listMode==='browse');
  updateStats();
  if(listMode==='browse'){
    currentList = filtered();
    renderList();
  }
}




function filtered(){
  var lv = (typeof currentLevel === 'string' && currentLevel) ? currentLevel : 'all';
  if(lv === 'all') return DATA.slice();
  return DATA.filter(function(e){ return e.level === lv; });
}

function applyFilter(){
  var s1 = document.getElementById('levelSelect');
  if(s1 && s1.value) currentLevel = s1.value;
  var s2 = document.getElementById('levelSelect2');
  if(s2) try{ s2.value = currentLevel; }catch(e){}
  document.querySelectorAll('input[name="fl"]').forEach(function(r){
    r.checked = (r.value === currentLevel);
  });
  try{ updateStats(); }catch(e){}
  currentList = filtered();
  renderList();
}

function syncLevelFromBrowse(){
  var s2 = document.getElementById('levelSelect2');
  if(s2) currentLevel = s2.value;
  var s1 = document.getElementById('levelSelect');
  if(s1) try{ s1.value = currentLevel; }catch(e){}
  document.querySelectorAll('input[name="fl"]').forEach(function(r){
    r.checked = (r.value === currentLevel);
  });
  try{ updateStats(); }catch(e){}
  currentList = filtered();
  renderList();
}

function setLevel(lv){
  currentLevel = lv || 'all';
  var s1 = document.getElementById('levelSelect');
  if(s1) try{ s1.value = currentLevel; }catch(e){}
  var s2 = document.getElementById('levelSelect2');
  if(s2) try{ s2.value = currentLevel; }catch(e){}
  document.querySelectorAll('input[name="fl"]').forEach(function(r){
    r.checked = (r.value === currentLevel);
  });
  try{ updateStats(); }catch(e){ console.warn(e); }
  currentList = filtered();
  try{ renderList(); }catch(e){ console.warn(e); }
  // force browse list visible when changing level from modal
  if(typeof listMode !== 'undefined' && listMode === 'browse'){
    var pb = document.getElementById('paneBrowse');
    if(pb) pb.style.display = '';
  }
  closeFilter();
}

function openFilter(){
  var modal = document.getElementById('filterModal');
  if(modal) modal.classList.add('open');
  document.querySelectorAll('input[name="fl"]').forEach(function(r){
    r.checked = (r.value === currentLevel);
  });
}
function closeFilter(){
  var modal = document.getElementById('filterModal');
  if(modal) modal.classList.remove('open');
}

function openDetail(id){
  currentList = filtered();
  currentIdx = currentList.findIndex(e=>e.id===id);
  if(currentIdx<0) currentIdx=0;
  showDetail();
}

function showDetail(){
  const e = currentList[currentIdx];
  if(!e) return;
  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');

  // keep small header word if exists
  var small = document.getElementById('dWordSmall');
  if(small) small.textContent = e.word || '';
  var dNum = document.getElementById('dNum');
  if(dNum) dNum.textContent = e.id || '';

  // hide legacy field blocks if present
  ['dHw','dPhon','dPos','dMean','dNote','dEn','dJa','dExEn','dExJa'].forEach(function(id){
    var el = document.getElementById(id);
    if(el){
      el.style.display = 'none';
      if(el.parentElement && el.parentElement.classList.contains('card')){
        // leave card structure
      }
    }
  });
  var sensesBox = document.getElementById('dSenses');
  if(sensesBox){ sensesBox.classList.remove('show'); sensesBox.innerHTML=''; sensesBox.style.display='none'; }

  var host = document.getElementById('detailBook');
  if(!host){
    host = document.createElement('div');
    host.id = 'detailBook';
    host.className = 'detail-book';
    var dp = document.getElementById('detailPlay');
    if(dp && dp.parentNode) dp.parentNode.insertBefore(host, dp);
    else document.getElementById('screen-detail').appendChild(host);
  }

  var pos = e.pos || '';
  var mean = e.mean || '';
  var phon = e.phon || '';
  var note = e.note || '';
  var senses = e.senses || [];

  var html = '';
  html += '<div class="db-idbar"><span>'+escapeHtml(e.id||'')+'</span><span>'+escapeHtml(e.level_label||e.level||'')+'</span></div>';
  html += '<div class="db-head">';
  html += '<div class="db-word tap-play" id="dbWord">'+escapeHtml(e.word||'')+'</div>';
  html += '<div class="db-meta">';
  if(phon) html += '<div class="db-phon">'+escapeHtml(phon)+'</div>';
  html += '<div class="db-posline">';
  if(pos) html += '<span class="db-pos">'+escapeHtml(pos)+'</span>';
  if(mean && !senses.length) html += '<span class="db-mean">'+escapeHtml(mean)+'</span>';
  else if(mean && senses.length) html += '<span class="db-mean" style="color:#666;font-size:12px">'+escapeHtml(mean)+'</span>';
  html += '</div></div></div>';

  if(note){
    html += '<div class="db-note"><span class="ico">◎</span>'+escapeHtml(note)+'</div>';
  }

  if(senses.length){
    senses.forEach(function(s){
      html += '<div class="db-sense">';
      html += '<div class="db-ex-en tap-play">'+highlightWord(s.en||'', e.word)+'</div>';
      html += '<div class="db-ex-zh">';
      if(s.pos) html += '<span class="db-pos">'+escapeHtml(s.pos)+'</span> ';
      if(s.mean) html += '<span style="color:#c45c1a">'+escapeHtml(s.mean)+'</span>　';
      html += escapeHtml(s.zh||'');
      html += '</div></div>';
    });
  } else {
    html += '<div class="db-ex">';
    html += '<div class="db-ex-en tap-play" id="dbExEn">'+highlightWord(e.en||'', e.word)+'</div>';
    html += '<div class="db-ex-zh" id="dbExZh">'+escapeHtml(e.ja||'')+'</div>';
    html += '</div>';
  }

  host.innerHTML = html;

  // tap to play on book elements
  var has = !!getAudioForEntry(e);
  var w = document.getElementById('dbWord');
  if(w){
    w.classList.toggle('tap-play', has);
    w.onclick = has ? function(){ playPart(e, 'word'); } : null;
  }
  host.querySelectorAll('.db-ex-en').forEach(function(el, idx){
    el.classList.toggle('tap-play', has);
    el.onclick = has ? (function(senseIndex){
      return function(){
        var info = getAudioForEntry(e);
        if(!info) return;
        var pairs = getPhrasePairs(info);
        var times = Math.max(getPhraseTimes(), 1);
        if(pairs[senseIndex]){
          var node = null;
          for(var t = times; t >= 1; t--){
            node = {file: info[0], start: pairs[senseIndex][0], end: pairs[senseIndex][1],
              title: e.word + '（例句'+(senseIndex+1)+'）', thenNext: node};
          }
          playClip(node.file, node.start, node.end, node.title, node.thenNext);
        } else {
          playPart(e, 'dExEn');
        }
      };
    })(idx) : null;
  });

  
  // hide leftover empty beige chrome
  document.querySelectorAll('.screen-detail .card, .screen-detail .detail-card').forEach(function(c){
    if(c.querySelector('#detailBook')) return;
    // if card only contains hidden fields / empty, hide it
    var txt = (c.textContent||'').replace(/\s+/g,' ').trim();
    if(txt.length < 8) c.style.display = 'none';
  });

  const st = statusMap[e.id]||'';
  var mb = document.getElementById('markBtn');
  if(mb){
    mb.textContent = st==='ok'?'✓':(st==='review'?'!':'○');
    mb.style.borderColor = st==='ok'?'#2a9d4a':(st==='review'?'#e05050':'#ddd');
    mb.style.color = st==='ok'?'#2a9d4a':(st==='review'?'#e05050':'#999');
  }
}


function bindTapPlay(e){
  const has = !!getAudioForEntry(e);
  const ids = ['dHw','dEn','dExEn','dWordSmall'];
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.toggle('tap-play', has);
    el.onclick = has ? function(){ playPart(e, id); } : null;
    el.title = has ? '點一下播放' : '';
  });
  // also mean/pos area → play word only
  var pos = document.getElementById('dPos');
  var mean = document.getElementById('dMean');
  [pos, mean].forEach(function(el){
    if(!el) return;
    el.classList.toggle('tap-play', has);
    el.onclick = has ? function(){ playPart(e, 'word'); } : null;
  });
}









function cycleDetailMark(){
  var e = currentList[currentIdx];
  if(!e) return;
  cycleStatus(e.id);
  // refresh mark icon on detail
  var st = statusMap[e.id]||'';
  var mb = document.getElementById('markBtn');
  if(mb){
    mb.textContent = st==='ok'?'✓':(st==='review'?'!':'○');
    mb.style.borderColor = st==='ok'?'#2a9d4a':(st==='review'?'#e05050':'#ddd');
    mb.style.color = st==='ok'?'#2a9d4a':(st==='review'?'#e05050':'#999');
  }
}

function cycleStatus(id){
  // 無 → review(!) → ok(✓) → 無
  var cur = statusMap[id] || '';
  var next = '';
  if(cur === '') next = 'review';
  else if(cur === 'review') next = 'ok';
  else next = '';
  if(next) statusMap[id] = next;
  else delete statusMap[id];
  saveStatus();
  updateStats();
  renderList();
}

function markStatus(st){
  const e = currentList[currentIdx];
  if(!e) return;
  statusMap[e.id] = st;
  saveStatus();
  nextItem();
}
function toggleMark(){
  const e = currentList[currentIdx];
  if(!e) return;
  const cur = statusMap[e.id]||'';
  statusMap[e.id] = cur==='ok' ? '' : 'ok';
  saveStatus();
  showDetail();
  updateStats();
}
function nextItem(){
  if(studyMode==='new'){
    // find next unlearned
    for(let i=currentIdx+1;i<currentList.length;i++){
      if(!statusMap[currentList[i].id]){ currentIdx=i; showDetail(); return; }
    }
    showList(); return;
  }
  if(studyMode==='review'){
    for(let i=currentIdx+1;i<currentList.length;i++){
      if(statusMap[currentList[i].id]==='review'){ currentIdx=i; showDetail(); return; }
    }
    showList(); return;
  }
  if(currentIdx+1 < currentList.length){ currentIdx++; showDetail(); }
  else showList();
}

function ensureAudio(){
  if(!window._kinAudio){
    window._kinAudio = document.getElementById('audioEl') || new Audio();
    window._kinAudio.setAttribute('playsinline','');
  }
  return window._kinAudio;
}























function getSenseUnits(info){
  var units = [];
  if(!info || info.length < 5) return units;
  for(var i = 3; i + 1 < info.length; ){
    var phrase = [info[i], info[i+1]];
    i += 2;
    var repeat = null;
    if(i + 1 < info.length){
      repeat = [info[i], info[i+1]];
      i += 2;
    }
    units.push({ phrase: phrase, repeat: repeat });
  }
  return units;
}
function getPhrasePairs(info){
  return getSenseUnits(info).map(function(u){ return u.phrase; });
}
function buildPhraseChain(file, info, word, times){
  var units = getSenseUnits(info);
  if(!units.length || times <= 0) return null;
  var t = Math.max(1, times|0);
  var seq = [];
  for(var ui = 0; ui < units.length; ui++){
    var u = units[ui];
    for(var k = 0; k < t; k++){
      var seg = (k > 0 && u.repeat) ? u.repeat : u.phrase;
      seq.push({ seg: seg, sense: ui + 1, total: units.length });
    }
  }
  var node = null;
  for(var i = seq.length - 1; i >= 0; i--){
    node = {
      file: file,
      start: seq[i].seg[0],
      end: seq[i].seg[1],
      title: word + '（例句' + seq[i].sense + '/' + seq[i].total + '）',
      thenNext: node
    };
  }
  return node;
}

function playClip(file, start, end, title, thenNext){
  try{
    start = +start || 0;
    end = +end || (start + 2);
    if(end <= start) end = start + 1.2;

    var bar = document.getElementById('playerBar');
    if(bar){ bar.classList.add('show'); bar.style.display = 'flex'; }
    var t1 = document.getElementById('playTitle');
    var t2 = document.getElementById('playSub');
    if(t1) t1.textContent = title || file;
    if(t2) t2.textContent = '準備播放…';

    // absolute-ish candidates from current page folder
    var base = '';
    try { base = location.href.replace(/[#?].*$/,'').replace(/[^\/]+$/, ''); } catch(e){}
    var candidates = [
      base + 'audio/kaitei_en/' + file,
      base + 'audio/' + file,
      'audio/kaitei_en/' + file,
      'audio/' + file
    ];

    var a = ensureAudio();
    a.pause();
    window._kinClip = { end: end, thenNext: thenNext };

    a.ontimeupdate = function(){
      if(!window._kinClip) return;
      if(a.currentTime >= window._kinClip.end - 0.05){
        a.pause();
        var n = window._kinClip.thenNext;
        window._kinClip = null;
        if(n) setTimeout(function(){ playClip(n.file, n.start, n.end, n.title, n.thenNext); }, 40);
      }
    };

    var i = 0;
    function tryOne(){
      if(i >= candidates.length){
        if(t2) t2.textContent = '載入失敗';
        alert('音檔找不到：' + file + '\n\n請確認：\n' + base + 'audio/kaitei_en/' + file);
        return;
      }
      var src = candidates[i++];
      if(t2) t2.textContent = src;
      a.onerror = function(){ a.onerror = null; tryOne(); };
      a.onloadeddata = function(){
        a.onloadeddata = null;
        a.onerror = null;
        try { a.currentTime = start; } catch(e){}
        var p = a.play();
        if(p && p.catch) p.catch(function(err){ alert('播放被擋：' + err.message); });
        if(t2) t2.textContent = file + ' ' + start.toFixed(1) + 's';
      };
      a.src = src;
      a.load();
    }
    tryOne();
  }catch(err){
    alert('playClip 錯誤：' + err.message);
  }
}




function playClipFiles(fileList, titles){
  if(!fileList || !fileList.length) return;
  var a = ensureAudio();
  var bar = document.getElementById('playerBar');
  if(bar){ bar.classList.add('show'); bar.style.display = 'flex'; }
  var queue = fileList.slice();
  var titleQ = (titles || []).slice();
  var bases = ['audio/clips/', './audio/clips/', 'audio/kaitei_en/clips/', 'audio/'];
  function playNext(){
    if(!queue.length){
      var b = document.getElementById('playBtn');
      if(b) b.textContent = '▶';
      return;
    }
    var f = queue.shift();
    var title = titleQ.shift() || f;
    var t1 = document.getElementById('playTitle');
    var t2 = document.getElementById('playSub');
    if(t1) t1.textContent = title;
    if(t2) t2.textContent = f;
    var bi = 0;
    function tryBase(){
      if(bi >= bases.length){
        if(t2) t2.textContent = '找不到 ' + f;
        playNext();
        return;
      }
      var src = bases[bi++] + f;
      a.onerror = function(){ a.onerror = null; tryBase(); };
      a.onended = function(){ a.onended = null; setTimeout(playNext, 60); };
      a.onloadeddata = function(){
        a.onloadeddata = null;
        a.play().catch(function(){ playNext(); });
        var b = document.getElementById('playBtn');
        if(b) b.textContent = '⏸';
      };
      a.src = src;
      a.load();
    }
    tryBase();
  }
  playNext();
}

function playCurrent(){
  try{
    var e = currentList && currentList[currentIdx];
    if(!e){ alert('沒有目前單字'); return; }
    var times = (typeof getPhraseTimes === 'function') ? getPhraseTimes() : 2;
    var cm = null;
    if(typeof CLIP_MAP !== 'undefined'){
      cm = CLIP_MAP[e.id] || CLIP_MAP[String(e.id)];
      if(!cm && e.id != null){
        var sid = String(e.id);
        if(/^\d+$/.test(sid)){
          cm = CLIP_MAP[('000'+sid).slice(-3)] || CLIP_MAP[String(parseInt(sid,10))];
        }
      }
    }
    if(cm && cm.word){
      var files = [cm.word];
      var titles = [e.word + '（單字）'];
      var phrases = cm.phrases || [];
      if(phrases.length >= 2 && phrases.length % 2 === 0){
        for(var i = 0; i < phrases.length; i += 2){
          var senseNo = (i/2) + 1;
          for(var t = 0; t < times; t++){
            files.push(t > 0 ? phrases[i+1] : phrases[i]);
            titles.push(e.word + '（例句' + senseNo + '）');
          }
        }
      } else {
        for(var i = 0; i < phrases.length; i++){
          for(var t = 0; t < times; t++){
            files.push(phrases[i]);
            titles.push(e.word + '（例句' + (i+1) + '）');
          }
        }
      }
      playClipFiles(files, titles);
      return;
    }
    var info = getAudioForEntry(e);
    if(!info){ alert('尚無音檔：' + e.id); return; }
    var chain = (typeof buildPhraseChain === 'function') ? buildPhraseChain(info[0], info, e.word, times) : null;
    playClip(info[0], info[1], info[2], e.word, chain);
  }catch(err){
    alert('playCurrent: ' + err.message);
  }
}

function playPart(e, which){
  var info = getAudioForEntry(e);
  if(!info){ alert('尚無音檔時間軸'); return; }
  if(which === 'word' || which === 'dHw' || which === 'dWordSmall' || which === 'dPos'){
    playClip(info[0], info[1], info[2], e.word, null);
  } else {
    var times = (typeof getPhraseTimes === 'function') ? getPhraseTimes() : 2;
    var chain = buildPhraseChain(info[0], info, e.word, times);
    if(chain) playClip(chain.file, chain.start, chain.end, chain.title, chain.thenNext);
  }
}

function getAudioForEntry(e){
  if(!e) return null;
  var id = String(e.id || '');
  if(AUDIO_MAP[id]) return AUDIO_MAP[id];
  var n = parseInt(id, 10);
  if(!isNaN(n)){
    if(AUDIO_MAP[String(n)]) return AUDIO_MAP[String(n)];
    var pad = ('000'+n).slice(-3);
    if(AUDIO_MAP[pad]) return AUDIO_MAP[pad];
  }
  var m = id.match(/^(S[1-7]|C)-0*(\d+)$/i);
  if(m){
    var alt1 = m[1].toUpperCase()+'-'+m[2];
    var alt2 = m[1].toUpperCase()+'-'+('000'+m[2]).slice(-3);
    if(AUDIO_MAP[alt1]) return AUDIO_MAP[alt1];
    if(AUDIO_MAP[alt2]) return AUDIO_MAP[alt2];
  }
  return null;
}







function setMediaSession(title, artist){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '金のフレーズ',
      artist: artist || '金フレ 音檔',
      album: 'TOEIC 金のフレーズ',
      artwork: [
        {src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23c45c1a" width="100" height="100" rx="20"/><text x="50" y="62" text-anchor="middle" fill="white" font-size="40" font-family="sans-serif">金</text></svg>'), sizes:'100x100', type:'image/svg+xml'}
      ]
    });
    navigator.mediaSession.playbackState = 'playing';
    navigator.mediaSession.setActionHandler('play', function(){ var a=ensureAudio(); a.play(); document.getElementById('playBtn').textContent='⏸'; });
    navigator.mediaSession.setActionHandler('pause', function(){ var a=ensureAudio(); a.pause(); document.getElementById('playBtn').textContent='▶'; });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ if(typeof nextWord==='function'){ nextWord(); setTimeout(function(){ playCurrent(); }, 150); } });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ if(typeof prevWord==='function'){ prevWord(); setTimeout(function(){ playCurrent(); }, 150); } });
  }catch(e){}
}
